<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMaster Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="./icons/android-launchericon-192-192.png">
    <meta name="theme-color" content="#667eea">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="preloader" class="preloader"><div class="spinner"></div></div>

    <!-- Banner de Permiso de Notificaciones -->
    <div id="notifPermissionBanner" class="notif-banner">
        <div class="notif-banner-content">
            <i class="fa-solid fa-bell-concierge"></i>
            <div>
                <h4 data-translate-key="notif_banner_title">¿Quieres recibir recordatorios?</h4>
                <p data-translate-key="notif_banner_text">Activaremos sonidos y alertas para tus tareas y pomodoros.</p>
            </div>
            <button id="btnAllowNotif" class="btn btn-primary" data-translate-key="btn_allow">Permitir</button>
            <button id="btnCloseNotifBanner" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <div class="app-wrapper">
        <div class="header">
            <h1 data-translate-key="title"></h1>
            <p data-translate-key="subtitle"></p>
            <div class="header-buttons">
                <div id="streakCounter" class="streak-counter" style="display: none;"></div>
                <button id="listViewBtn" class="header-btn active" title="Vista de Lista" aria-label="Lista"><i class="fa-solid fa-list-ul"></i></button>
                <button id="calendarViewBtn" class="header-btn" title="Calendario" aria-label="Calendario"><i class="fa-solid fa-calendar-days"></i></button>
                <button id="historyBtn" class="header-btn" title="Historial" aria-label="Historial"><i class="fa-solid fa-clock-rotate-left"></i></button>
                <button id="statsBtn" class="header-btn" title="Metas" aria-label="Metas"><i class="fa-solid fa-bullseye"></i></button>
                <button id="dashboardBtn" class="header-btn" title="Dashboard" aria-label="Dashboard"><i class="fa-solid fa-chart-line"></i></button>
                <button id="settingsBtn" class="header-btn" title="Configuración" aria-label="Ajustes"><i class="fa-solid fa-gear"></i></button>
            </div>
        </div>

        <div class="app-content">
            <div class="container">
                <div class="stats" id="statsContainer"></div>
                
                <div class="main-content">
                    <!-- Vista Lista -->
                    <div id="list-view-section" class="task-section">
                        <div id="taskFormContainer"></div>
                        <div class="task-controls">
                            <input type="search" id="searchInput" data-translate-key-placeholder="placeholder_search">
                            <select id="filterCategory"></select>
                        </div>
                        <div id="tasksList"></div>
                    </div>

                    <!-- Vista Calendario -->
                    <div id="calendar-view-section" class="calendar-section view-hidden">
                        <div id="calendar"></div>
                    </div>

                    <!-- Vista Historial -->
                    <div id="history-view-section" class="task-section view-hidden">
                        <h2 class="section-title" data-translate-key="history_title">Historial de Tareas</h2>
                        <div id="historyList"></div>
                    </div>

                    <!-- Sidebar -->
                    <div class="sidebar">
                        <div class="notifications">
                            <h3 class="section-title" data-translate-key="title_notifications"></h3>
                            <div id="notificationsList"></div>
                        </div>
                        <div class="pomodoro">
                            <h3 class="section-title" data-translate-key="title_pomodoro"></h3>
                            <div id="pomodoroTaskTitle" class="pomodoro-task-title"></div>
                            <div id="pomodoroTimer" class="pomodoro-timer">25:00</div>
                            <div id="pomodoroCycleTitle" class="pomodoro-cycle-title"></div>
                            <div class="pomodoro-controls">
                                <button class="pomodoro-btn play-btn" id="playBtn"><i class="fa-solid fa-play"></i></button>
                                <button class="pomodoro-btn pause-btn" id="pauseBtn"><i class="fa-solid fa-pause"></i></button>
                                <button class="pomodoro-btn reset-btn" id="resetBtn"><i class="fa-solid fa-stop"></i></button>
                                <button class="pomodoro-btn skip-btn" id="skipBtn"><i class="fa-solid fa-forward"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="footer-copyright">Copyright © 2025 LUFTMANDMAURICIO</div>
            </div>
        </div>
    </div>
    
    <!-- Modales (Ajustados para gestión de categorías) -->
    <div class="modal-overlay" id="settingsModal"><div class="modal"><div class="modal-header settings"><h3 data-translate-key="settings_title"></h3></div><div class="modal-body">
        <!-- Personalización -->
        <div class="settings-group">
            <h4><i class="fa-solid fa-wand-magic-sparkles"></i> Personalización</h4>
            <div class="form-group"><label data-translate-key="settings_theme">Tema</label><select id="themeSelector">
                <option value="light">Claro</option><option value="dark">Oscuro</option>
                <option value="ocean">Océano</option><option value="forest">Bosque</option>
            </select></div>
            <div class="form-group">
                <label>Color de Acento</label>
                <div class="color-picker-wrapper"><input type="color" id="accentColorPicker"> <button id="resetAccentColor" class="btn">Reset</button></div>
            </div>
        </div>

        <!-- GESTIÓN DE CATEGORÍAS (NUEVO) -->
        <div class="settings-group" style="border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px;">
            <h4><i class="fa-solid fa-tags"></i> Mis Categorías</h4>
            <div id="categoryManagerList" class="category-manager-list"></div>
            <div class="category-add-form">
                <input type="text" id="newCatName" placeholder="Nueva categoría...">
                <input type="color" id="newCatColor" value="#4facfe">
                <button id="btnAddCategory" class="btn btn-primary">Añadir</button>
            </div>
        </div>

        <!-- Otros Ajustes -->
        <div class="settings-group" style="border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px;">
            <div class="form-group"><label data-translate-key="settings_language">Idioma</label><select id="languageSelector"><option value="es">Español</option><option value="en">English</option></select></div>
            <div class="form-group"><label data-translate-key="settings_sound_theme">Sonido</label><select id="soundThemeSelector"><option value="classic">Clásico</option><option value="digital">Digital</option></select></div>
        </div>
    </div><div class="modal-actions"><button id="closeSettings" class="modal-btn btn-primary" data-translate-key="btn_close">Cerrar</button></div></div></div>

    <div class="modal-overlay" id="deleteModal"><div class="modal"><div class="modal-header"><h3>Eliminar</h3></div><div class="modal-body"><p>¿Seguro que quieres borrar esto?</p></div><div class="modal-actions"><button id="cancelDelete" class="modal-btn">Cancelar</button><button id="confirmDelete" class="modal-btn" style="background-color: #e53e3e; color: white;">Eliminar</button></div></div></div>
    
    <div class="modal-overlay" id="dashboardModal"><div class="modal"><div class="modal-header dashboard"><h3>📊 Dashboard</h3></div><div class="modal-body"><canvas id="completedTasksChart"></canvas><canvas id="categoryDistributionChart"></canvas></div><div class="modal-actions"><button id="closeDashboard" class="modal-btn btn-primary">Cerrar</button></div></div></div>

    <div id="toast" class="toast"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
