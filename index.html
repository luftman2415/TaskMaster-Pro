<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMaster Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="./icons/android-launchericon-192-192.png">
    <meta name="theme-color" content="#667eea">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="preloader" class="preloader"><div class="spinner"></div></div>

    <!-- Banner de Permiso de Notificaciones -->
    <div id="notifPermissionBanner" class="notif-banner">
        <div class="notif-banner-content">
            <i class="fa-solid fa-bell-concierge"></i>
            <div>
                <h4 data-translate-key="notif_banner_title">¿Quieres activar recordatorios?</h4>
                <p data-translate-key="notif_banner_text">Recibirás alertas sonoras para tus tareas y pomodoros.</p>
            </div>
            <button id="btnAllowNotif" class="btn btn-primary" data-translate-key="btn_allow">Permitir</button>
            <button id="btnCloseNotifBanner" class="header-btn" style="background:none; color:gray;"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <div class="app-wrapper">
        <div class="header">
            <h1 data-translate-key="title"></h1>
            <p data-translate-key="subtitle"></p>
            <div class="header-buttons">
                <div id="streakCounter" class="streak-counter" style="display: none;"></div>
                <button id="listViewBtn" class="header-btn active" title="Lista (L)"><i class="fa-solid fa-list-ul"></i></button>
                <button id="calendarViewBtn" class="header-btn" title="Calendario (C)"><i class="fa-solid fa-calendar-days"></i></button>
                <button id="historyViewBtn" class="header-btn" title="Historial (H)"><i class="fa-solid fa-clock-rotate-left"></i></button>
                <button id="statsBtn" class="header-btn" title="Estadísticas (M)"><i class="fa-solid fa-bullseye"></i></button>
                <button id="dashboardBtn" class="header-btn" title="Dashboard (D)"><i class="fa-solid fa-chart-line"></i></button>
                <button id="settingsBtn" class="header-btn" title="Ajustes (S)"><i class="fa-solid fa-gear"></i></button>
                <a href="manual.html" target="_blank" id="helpBtn" class="header-btn" title="Ayuda"><i class="fa-solid fa-circle-question"></i></a>
            </div>
        </div>

        <div class="app-content">
            <div class="container">
                <div class="stats" id="statsContainer"></div>
                <div class="main-content">
                    <!-- VISTA LISTA -->
                    <div id="list-view-section" class="task-section">
                        <div id="taskFormContainer"></div>
                        <div class="task-controls">
                            <input type="search" id="searchInput" data-translate-key-placeholder="placeholder_search">
                            <select id="filterCategory"></select>
                        </div>
                        <div id="tasksList"></div>
                    </div>

                    <!-- VISTA HISTORIAL -->
                    <div id="history-view-section" class="task-section view-hidden">
                        <h2 class="section-title" data-translate-key="history_title">Historial</h2>
                        <div id="historyList"></div>
                    </div>

                    <!-- VISTA CALENDARIO -->
                    <div id="calendar-view-section" class="calendar-section view-hidden">
                        <div id="calendar"></div>
                    </div>

                    <div class="sidebar">
                        <div class="notifications">
                            <h3 class="section-title" data-translate-key="title_notifications"></h3>
                            <div id="notificationsList"></div>
                        </div>
                        <div class="pomodoro">
                            <h3 class="section-title" data-translate-key="title_pomodoro"></h3>
                            <div id="pomodoroTaskTitle" class="pomodoro-task-title"></div>
                            <div id="pomodoroTimer" class="pomodoro-timer">25:00</div>
                            <div id="pomodoroCycleTitle" class="pomodoro-cycle-title"></div>
                            <div class="pomodoro-controls">
                                <button class="pomodoro-btn play-btn" id="playBtn"><i class="fa-solid fa-play"></i></button>
                                <button class="pomodoro-btn pause-btn" id="pauseBtn"><i class="fa-solid fa-pause"></i></button>
                                <button class="pomodoro-btn reset-btn" id="resetBtn"><i class="fa-solid fa-stop"></i></button>
                                <button class="pomodoro-btn skip-btn" id="skipBtn"><i class="fa-solid fa-forward"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="footer-copyright">Copyright © 2025 LUFTMANDMAURICIO</div>
            </div>
        </div>
    </div>
    
    <!-- Modales -->
    <div class="modal-overlay" id="deleteModal"><div class="modal"><div class="modal-header"><h3>Eliminar</h3></div><div class="modal-body"><p>¿Borrar esta tarea?</p></div><div class="modal-actions"><button id="cancelDelete" class="modal-btn">No</button><button id="confirmDelete" class="modal-btn" style="background:#e53e3e; color:white;">Sí, eliminar</button></div></div></div>
    
    <div class="modal-overlay" id="editTaskModal"><div class="modal"><div class="modal-header edit"><h3>Editar</h3></div><div class="modal-body">
        <div class="form-group"><label>Tarea</label><input type="text" id="editTaskTitle"></div>
        <div class="form-group"><label>Hora</label><input type="time" id="editTaskTime"></div>
        <div class="form-group"><label>Notas</label><textarea id="editTaskNotes"></textarea></div>
        <div class="form-group"><label>Sub-tareas</label><div id="editSubtaskList"></div><input type="text" id="newSubtaskInput" placeholder="Añadir sub-tarea..."></div>
    </div><div class="modal-actions"><button id="cancelEdit" class="modal-btn">Cancelar</button><button id="saveEdit" class="modal-btn btn-primary">Guardar</button></div></div></div>

    <div class="modal-overlay" id="settingsModal"><div class="modal"><div class="modal-header settings"><h3 data-translate-key="settings_title"></h3></div><div class="modal-body">
        <div style="margin-bottom:20px;">
            <h4><i class="fa-solid fa-wand-magic-sparkles"></i> Personalización</h4>
            <div class="form-group"><label>Fuente</label><select id="fontSelector"><option value="sans-serif">Moderna</option><option value="serif">Clásica</option><option value="mono">Técnica</option></select></div>
            <div class="form-group"><label>Color de Acento</label><div class="color-picker-wrapper"><input type="color" id="accentColorPicker"> <button id="resetAccentColor" class="btn">Reset</button></div></div>
        </div>
        
        <!-- Gestión de Categorías -->
        <div style="border-top: 1px solid var(--border-color); padding-top:15px; margin-top:15px;">
            <h4><i class="fa-solid fa-tags"></i> Categorías</h4>
            <div id="categoryManagerList" class="category-manager-list"></div>
            <div class="category-add-form">
                <input type="text" id="newCatName" placeholder="Nueva categoría...">
                <input type="color" id="newCatColor" value="#4facfe">
                <button id="btnAddCategory" class="btn btn-primary">Añadir</button>
            </div>
        </div>

        <div style="border-top: 1px solid var(--border-color); padding-top:15px; margin-top:15px;">
            <div class="form-group"><label>Tema</label><select id="themeSelector"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="ocean">Océano</option><option value="forest">Bosque</option></select></div>
            <div class="form-group"><label>Idioma</label><select id="languageSelector"><option value="es">Español</option><option value="en">English</option></select></div>
        </div>
    </div><div class="modal-actions"><button id="closeSettings" class="modal-btn btn-primary">Cerrar</button></div></div></div>

    <div class="modal-overlay" id="dashboardModal"><div class="modal"><div class="modal-header dashboard"><h3>📊 Dashboard</h3></div><div class="modal-body"><div class="chart-container"><canvas id="completedTasksChart"></canvas></div><div class="chart-container"><canvas id="categoryDistributionChart"></canvas></div></div><div class="modal-actions"><button id="closeDashboard" class="modal-btn btn-primary">Cerrar</button></div></div></div>
    
    <div id="toast" class="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
